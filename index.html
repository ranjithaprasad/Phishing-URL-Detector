<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhishGuard | URL Security Scanner</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#080f1e;color:#eaf1ff}
header{padding:22px 8%;border-bottom:1px solid #26344c;display:flex;justify-content:space-between}
.logo{font-size:23px;font-weight:bold;color:#50b8ff}
main{max-width:850px;margin:65px auto;padding:20px}
.hero{text-align:center}
.hero h1{font-size:38px;margin-bottom:12px}
.hero p{color:#9aabc4;line-height:1.6}
.panel{background:#111d31;border:1px solid #263d5c;border-radius:16px;padding:28px;margin-top:30px}
input{width:100%;padding:16px;background:#091426;border:1px solid #405675;border-radius:9px;color:white;font-size:15px}
button{width:100%;margin-top:15px;padding:15px;background:#087ee8;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#0067c5}
#result{display:none;margin-top:22px;padding:20px;background:#091426;border-radius:10px;line-height:1.7}
.good{color:#42d99a}.bad{color:#ff7777}
footer{text-align:center;color:#8293aa;padding:30px;font-size:12px}
li{margin:6px 0}
</style>
</head>
<body>
<header>
<div class="logo">🛡️ PhishGuard</div>
<div>URL Security Scanner</div>
</header>
<main>
<section class="hero">
<h1>Detect Suspicious URLs</h1>
<p>Analyse website addresses for common phishing indicators and suspicious patterns.</p>
</section>
<section class="panel">
<h3>Enter Website URL</h3>
<input id="url" type="text" placeholder="https://example.com">
<button onclick="scanURL()">Scan URL</button>
<div id="result"></div>
</section>
</main>
<footer>PhishGuard | Educational Cybersecurity Project</footer>
<script>
function scanURL(){
 const input=document.getElementById("url").value.trim();
 const result=document.getElementById("result");
 result.style.display="block";
 if(!input){
 result.innerHTML="<span class='bad'>Please enter a URL.</span>";
 return;
 }
 let u;
 try{
 u=new URL(input);
 if(!["http:","https:"].includes(u.protocol)) throw Error();
 }catch(e){
 result.innerHTML="<span class='bad'>Invalid URL. Enter a complete HTTP or HTTPS URL.</span>";
 return;
 }
 let flags=[];
 const host=u.hostname.toLowerCase();
 if(u.protocol==="http:") flags.push("Website does not use HTTPS");
 if(u.username||u.password) flags.push("URL contains user information before the host");
 if(host.startsWith("xn--")||host.includes(".xn--")) flags.push("Internationalised domain name detected");
 if(/^(\d{1,3}\.){3}\d{1,3}$/.test(host)) flags.push("IP address used instead of a domain name");
 if(host.split(".").length>4) flags.push("Unusually many subdomains");
 if(host.includes("login")||host.includes("verify")||host.includes("secure")||host.includes("account")) flags.push("Security-related words in domain");
 if(host.includes("-")) flags.push("Hyphen in domain name");
 if(u.href.length>100) flags.push("Unusually long URL");
 if((u.href.match(/@/g)||[]).length) flags.push("At symbol found in URL");
 if(u.href.split("//").length>2) flags.push("Multiple protocol separators found");
 const score=Math.min(flags.length*15,100);
 result.innerHTML="<h3>Scan Results</h3>"+
 "<p>Risk score: <b>"+score+"/100</b></p>"+
 "<h4>"+(flags.length?"Potentially suspicious":"No obvious suspicious patterns detected")+"</h4>"+
 (flags.length?"<ul>"+flags.map(f=>"<li>"+f+"</li>").join("")+"</ul>":"<p>No configured indicators were found.</p>")+
 "<p><small>This is a basic heuristic scan, not a definitive malware or phishing detection. Do not open suspicious links.</small></p>";
}
</script>
</body>
</html>
